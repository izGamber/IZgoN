global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: 'izgon'

scrape_configs:
  - job_name: 'izgon-metrics'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']
    metrics_path: '/metrics'
