name: CI

on:
  push:
    branches: [main, enhancement/production-ready, develop]
  pull_request:
    branches: [main, enhancement/production-ready, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run tests
        env:
          DATAPULSE_REDIS_URL: redis://localhost:6379/0
          DATAPULSE_API_KEY: test-key
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Check formatting with Black
        run: black --check app.py benchmark.py
        continue-on-error: true
      
      - name: Check import sorting with isort
        run: isort --check-only app.py benchmark.py
        continue-on-error: true
      
      - name: Lint with flake8
        run: flake8 app.py benchmark.py --max-line-length=100 --count --statistics
        continue-on-error: true
      
      - name: Type check with mypy
        run: mypy app.py --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: izgon:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
