services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  izgon:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATAPULSE_REDIS_URL: redis://redis:6379/0
      DATAPULSE_DB_PATH: /data/datapulse_events.db
      DATAPULSE_API_KEY: ${DATAPULSE_API_KEY:-dev-local-key}
      DATAPULSE_FREE_TIER_LIMIT: ${DATAPULSE_FREE_TIER_LIMIT:-10000}
      DATAPULSE_LICENSE_KEY: ${DATAPULSE_LICENSE_KEY:-}
      DATAPULSE_LICENSE_SECRET: ${DATAPULSE_LICENSE_SECRET:-}
      DATAPULSE_ALLOWED_ORIGINS: ${DATAPULSE_ALLOWED_ORIGINS:-*}
    volumes:
      - izgon-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # ProxyHandler({}) ignores any http_proxy inherited from the host — without
      # it, a machine behind a corporate proxy reports this container unhealthy
      # forever even though the service is fine.
      test: ["CMD", "python", "-c", "import urllib.request,sys; o=urllib.request.build_opener(urllib.request.ProxyHandler({})); sys.exit(0 if o.open('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis-data:
  izgon-data:
